# Checks the ledger and the store's own tools on every pull request and push.
# Submissions do not come as pull requests (they come through Discord); this
# guards changes to the tools and anything the bot writes.
# Before going live: pin every action to a full commit SHA.
name: validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ledger:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - run: python3 tools/store.py validate
      - run: python3 tools/test_store.py
      - run: make -C client check   # the phone's client: install, update, services, uninstall
